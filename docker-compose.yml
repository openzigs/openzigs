version: "3.9"

services:
  agent:
    build: .
    container_name: openzigs-agent
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - openzigs-data:/data
      - ./config:/app/config:ro
      # Optional: mount project directory
      # - ~/projects:/workspace
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - CHROME_DEBUG_HOST=host.docker.internal
      - CHROME_DEBUG_PORT=9222
      - OPENZIGS_CONFIG_DIR=/app/config
      - OPENZIGS_DATA_DIR=/data
      - OPENZIGS_WORKSPACE=/workspace
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - openzigs-network

  tunnel:
    image: cloudflare/cloudflared:2024.6.1
    container_name: openzigs-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://agent:3000
    depends_on:
      agent:
        condition: service_healthy
    networks:
      - openzigs-network

  # ── Audio Sidecar (Local STT + TTS via MLX) ──
  audio-sidecar:
    build: ./sidecars/audio
    container_name: openzigs-audio-sidecar
    restart: unless-stopped
    ports:
      - "5006:5006"
    environment:
      - AUDIO_PORT=5006
      - AUDIO_HOST=0.0.0.0
      - AUDIO_IDLE_TIMEOUT=${AUDIO_IDLE_TIMEOUT:-300}
    networks:
      - openzigs-network

  # ── v2a / MMAudio Sidecar (Issue #939, opt-in profile) ──
  # Most dev/desktop deployments run this in WSL via
  # `sidecars/start-cuda-sidecars.sh` because CUDA passthrough into Docker
  # Desktop is brittle on Windows. Enable here only on Linux hosts with the
  # NVIDIA Container Toolkit installed:
  #   docker compose --profile v2a up -d v2a-sidecar
  v2a-sidecar:
    build: ./sidecars/v2a
    container_name: openzigs-v2a-sidecar
    profiles: ["v2a"]
    restart: unless-stopped
    ports:
      - "5012:5012"
    environment:
      - PORT=5012
      - V2A_MODEL=${V2A_MODEL:-hkchengrex/MMAudio}
      - V2A_DEFAULT_DURATION=${V2A_DEFAULT_DURATION:-8.0}
      - V2A_MAX_DURATION=${V2A_MAX_DURATION:-30.0}
      - V2A_IDLE_TIMEOUT=${V2A_IDLE_TIMEOUT:-300}
      - WORKER_SECRET_TOKEN=${WORKER_SECRET_TOKEN:-}
      - HF_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    networks:
      - openzigs-network

volumes:
  openzigs-data:

networks:
  openzigs-network:
    driver: bridge
