# gitleaks config — secret scanning for OpenZigs
# Detects committed secrets using built-in rules plus custom OpenZigs-specific
# patterns. Paired with `.husky/pre-commit` and `.github/workflows/gitleaks.yml`.

title = "openzigs"

# Inherit gitleaks default rules (40+ secret types: AWS keys, GitHub tokens,
# Slack tokens, Stripe keys, etc.). The `[extend]` block keeps default rules
# while letting us add the custom OpenZigs-token rule below.
[extend]
useDefault = true

# Custom rule: catches the OpenZigs local-auth bearer-token shape (64-char hex)
# even when it's not adjacent to a known prefix. Tightened with proximity to
# words like `token`, `auth`, `bearer` to keep false positives down.
[[rules]]
id = "openzigs-local-auth-token"
description = "OpenZigs local-auth bearer token (64-char hex string)"
regex = '''(?i)(token|auth|bearer|secret|apikey)[^\n]{0,40}([a-f0-9]{64})'''
secretGroup = 2
keywords = ["token", "auth", "bearer", "secret", "apikey"]

[allowlist]
description = "Files and paths exempt from secret scanning"
# Test fixtures and lockfiles routinely contain example tokens that look real
# but are intentionally fake.
paths = [
  '''(.*?)(jpg|gif|doc|pdf|bin|svg|socket)$''',
  '''pnpm-lock\.yaml$''',
  '''package-lock\.json$''',
  '''CHANGELOG\.md$''',
  '''\.gitleaks\.toml$''',
  '''docs/''',
  '''^test-chat\.mjs$''',
  '''^scripts/social-brain-simulated-tests\.(sh|py)$''',
  '''^scripts/create-real-pins\.py$''',
  '''^tmp/''',
  '''^src/api/presenter\.test\.ts$''',
]
# Allow tokens that appear next to obvious example markers.
regexes = [
  '''example[_-]?token''',
  '''dummy[_-]?token''',
  '''fake[_-]?token''',
  '''XXXXXXXX''',
]
