<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenZigs Chat</title>
  <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
  <div id="app">
    <header class="chat-header">
      <h1 class="chat-title">OpenZigs</h1>
      <div class="model-selector">
        <label for="model-select" class="model-label">Model</label>
        <select id="model-select" class="model-select" disabled>
          <option value="">Loading…</option>
        </select>
      </div>
      <div id="connection-status" class="status-dot disconnected" title="Disconnected"></div>
      <a href="/admin.html" class="admin-link" title="Admin Settings">&#9881;</a>
    </header>

    <main id="messages" class="messages-container"></main>

    <footer class="chat-input-bar">
      <form id="chat-form" class="chat-form">
        <textarea
          id="message-input"
          class="message-input"
          placeholder="Type a message…"
          rows="1"
          autocomplete="off"
          disabled
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" disabled>Send</button>
      </form>
    </footer>

    <div id="approval-overlay" class="approval-overlay hidden">
      <div class="approval-card">
        <h3>Tool Approval Required</h3>
        <p id="approval-tool" class="approval-tool"></p>
        <p id="approval-explanation" class="approval-explanation"></p>
        <pre id="approval-preview" class="approval-preview"></pre>
        <div class="approval-actions">
          <button id="approval-approve" class="btn btn-approve">Approve</button>
          <button id="approval-deny" class="btn btn-deny">Deny</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
