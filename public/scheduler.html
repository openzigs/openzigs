<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduler — OpenZigs</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div id="app">
    <header class="admin-header">
      <a href="/admin" class="back-link">&larr; Admin</a>
      <h1 class="admin-title">Scheduler</h1>
    </header>

    <main class="admin-main">
      <section class="admin-section">
        <p class="section-desc">Schedule recurring jobs with cron expressions. Jobs can execute saved prompts, shell commands, or custom actions.</p>

        <div class="library-toolbar">
          <div style="flex:1"></div>
          <button id="add-job-btn" class="primary-button">+ New Job</button>
        </div>

        <div id="job-form-container" class="prompt-form-container hidden"></div>

        <div id="job-list" class="scheduler-list">
          <div class="loading">Loading…</div>
        </div>
      </section>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/scheduler.js"></script>
</body>
</html>
