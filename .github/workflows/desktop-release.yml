name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g., v0.2.0). Leave empty for draft."
        required: false

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            build_cmd: pnpm --filter openzigs-desktop dist:win
          - os: macos-latest
            platform: mac
            arch: arm64
            build_cmd: pnpm --filter openzigs-desktop dist:mac:arm64
          - os: macos-13
            platform: mac
            arch: x64
            build_cmd: pnpm --filter openzigs-desktop dist:mac:x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      # ── Build backend & UI ──────────────────────────────────

      - name: Build backend
        run: pnpm build

      - name: Build UI (standalone)
        working-directory: ui
        run: pnpm build

      - name: Build desktop
        run: pnpm --filter openzigs-desktop build

      # ── Code Signing (stubs — enable when certs are configured) ──

      # Windows Authenticode signing
      # Uncomment and configure when certificate is available.
      # See docs/code-signing.md for setup instructions.
      #
      # Options:
      #   A) Azure Trusted Signing (~$10/mo) — recommended
      #   B) SSL.com EV cert + Azure Key Vault
      #   C) DigiCert EV cert + hardware token
      #
      # - name: Configure Windows signing
      #   if: matrix.platform == 'win'
      #   env:
      #     CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      #     CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      #   run: echo "Windows code signing configured"

      # macOS Developer ID signing
      # Uncomment and configure when Apple Developer account is set up.
      # Requires: Apple Developer ID Application certificate in p12 format.
      #
      # - name: Import macOS signing certificate
      #   if: matrix.platform == 'mac'
      #   env:
      #     CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      #     CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: echo "macOS code signing + notarization configured"

      # ── Package with electron-builder ───────────────────────

      - name: Package desktop app
        run: ${{ matrix.build_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable signing until certs are configured
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # ── Upload artifacts ────────────────────────────────────

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 30

  # ── Publish to GitHub Releases ────────────────────────────

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
