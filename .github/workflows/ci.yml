name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean stale artifacts
        run: rm -rf node_modules dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  ui:
    runs-on: [self-hosted, macOS, ARM64]
    env:
      NPM_CONFIG_PRODUCTION: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean stale artifacts
        run: rm -rf node_modules ui/node_modules ui/.next

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Lint UI
        working-directory: ui
        run: pnpm lint

      - name: Test UI
        working-directory: ui
        run: pnpm test

      - name: Build UI
        working-directory: ui
        run: pnpm build

  e2e:
    needs: [api, ui]
    runs-on: [self-hosted, macOS, ARM64]
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      CHROME_AUTO_LAUNCH: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Kill stale processes on E2E ports
        run: |
          lsof -ti:3000 | xargs kill -9 2>/dev/null || true
          lsof -ti:3001 | xargs kill -9 2>/dev/null || true
          lsof -ti:3101 | xargs kill -9 2>/dev/null || true

      - name: Clean stale artifacts
        run: rm -rf node_modules ui/node_modules ui/.next

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Install Playwright browsers
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Extract auth token
        id: auth
        run: |
          TOKEN=""
          if [ -f ~/.openzigs/config.json ]; then
            TOKEN=$(python3 -c "import json; print(json.load(open('$HOME/.openzigs/config.json')).get('auth',{}).get('token',''))" 2>/dev/null || echo "")
          fi
          if [ -z "$TOKEN" ]; then
            TOKEN=$(openssl rand -hex 32)
            mkdir -p ~/.openzigs && chmod 700 ~/.openzigs
            python3 -c "import json,os; p=os.path.expanduser('~/.openzigs/config.json'); d=json.load(open(p)) if os.path.exists(p) else {}; d.setdefault('auth',{})['token']=\"$TOKEN\"; json.dump(d,open(p,'w'),indent=2)"
            chmod 600 ~/.openzigs/config.json
          fi
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Start backend
        run: pnpm dev &
        env:
          PORT: 3000

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health && exit 0 || sleep 2
          done
          echo "Backend failed to start" && exit 1

      - name: Run E2E tests
        working-directory: ui
        run: npx playwright test
        env:
          NEXT_PUBLIC_OPENZIGS_API_BASE: http://localhost:3000
          NEXT_PUBLIC_OPENZIGS_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Kill background processes
        if: always()
        run: |
          lsof -ti:3000 | xargs kill -9 2>/dev/null || true
          lsof -ti:3001 | xargs kill -9 2>/dev/null || true
          lsof -ti:3101 | xargs kill -9 2>/dev/null || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7
