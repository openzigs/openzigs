name: Update Package Manifests

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  update-scoop:
    name: Update Scoop Bucket
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scoop bucket
        uses: actions/checkout@v4
        with:
          repository: openzigs/scoop-openzigs
          token: ${{ secrets.PKG_REPO_TOKEN }}
          path: scoop-bucket

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download and hash Windows installer
        id: hash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/openzigs/openzigs/releases/download/v${VERSION}/OpenZigs-Setup-${VERSION}.exe"
          curl -sLO "$URL"
          HASH=$(sha256sum "OpenZigs-Setup-${VERSION}.exe" | cut -d' ' -f1)
          echo "sha256=$HASH" >> $GITHUB_OUTPUT

      - name: Update manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HASH="${{ steps.hash.outputs.sha256 }}"
          
          cat > scoop-bucket/bucket/openzigs.json << EOF
          {
            "version": "$VERSION",
            "description": "Open-source AI assistant & automation platform",
            "homepage": "https://github.com/openzigs/openzigs",
            "license": "BSL-1.1",
            "architecture": {
              "64bit": {
                "url": "https://github.com/openzigs/openzigs/releases/download/v$VERSION/OpenZigs-Setup-$VERSION.exe",
                "hash": "$HASH"
              }
            },
            "installer": {
              "script": [
                "Start-Process -FilePath \"\$dir\\\$fname\" -ArgumentList '/S', '/D=\$dir' -Wait"
              ]
            },
            "uninstaller": {
              "script": [
                "Start-Process -FilePath \"\$dir\\Uninstall OpenZigs.exe\" -ArgumentList '/S' -Wait"
              ]
            },
            "bin": [],
            "shortcuts": [
              ["OpenZigs.exe", "OpenZigs"]
            ],
            "notes": "OpenZigs desktop app. After installation, open from Start Menu or run 'openzigs' in terminal.",
            "checkver": {
              "github": "https://github.com/openzigs/openzigs"
            },
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/openzigs/openzigs/releases/download/v\$version/OpenZigs-Setup-\$version.exe"
                }
              }
            }
          }
          EOF

      - name: Commit and push
        working-directory: scoop-bucket
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/openzigs.json
          git commit -m "Update openzigs to v${{ steps.version.outputs.version }}" || echo "No changes"
          git push

  update-homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: openzigs/homebrew-tap
          token: ${{ secrets.PKG_REPO_TOKEN }}
          path: homebrew-tap

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download and hash macOS installers
        id: hash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          
          # ARM64
          curl -sLO "https://github.com/openzigs/openzigs/releases/download/v${VERSION}/OpenZigs-${VERSION}-arm64.dmg"
          ARM64_HASH=$(sha256sum "OpenZigs-${VERSION}-arm64.dmg" | cut -d' ' -f1)
          
          # x64
          curl -sLO "https://github.com/openzigs/openzigs/releases/download/v${VERSION}/OpenZigs-${VERSION}-x64.dmg"
          X64_HASH=$(sha256sum "OpenZigs-${VERSION}-x64.dmg" | cut -d' ' -f1)
          
          echo "arm64=$ARM64_HASH" >> $GITHUB_OUTPUT
          echo "x64=$X64_HASH" >> $GITHUB_OUTPUT

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARM64_HASH="${{ steps.hash.outputs.arm64 }}"
          X64_HASH="${{ steps.hash.outputs.x64 }}"
          
          cat > homebrew-tap/Casks/openzigs.rb << 'FORMULA'
          # frozen_string_literal: true

          cask "openzigs" do
            arch arm: "arm64", intel: "x64"

            version "VERSION_PLACEHOLDER"
            sha256 arm:   "ARM64_HASH_PLACEHOLDER",
                   intel: "X64_HASH_PLACEHOLDER"

            url "https://github.com/openzigs/openzigs/releases/download/v#{version}/OpenZigs-#{version}-#{arch}.dmg",
                verified: "github.com/openzigs/openzigs/"
            name "OpenZigs"
            desc "Open-source AI assistant & automation platform"
            homepage "https://github.com/openzigs/openzigs"

            livecheck do
              url :url
              strategy :github_latest
            end

            auto_updates true
            depends_on macos: ">= :ventura"

            app "OpenZigs.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-rd", "com.apple.quarantine", "#{appdir}/OpenZigs.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Application Support/OpenZigs",
              "~/Library/Caches/com.openzigs.desktop",
              "~/Library/Preferences/com.openzigs.desktop.plist",
              "~/Library/Logs/OpenZigs",
              "~/.openzigs",
            ]

            caveats <<~EOS
              OpenZigs requires Node.js 20+ and Docker for full functionality.
              
              On first launch, you may need to allow the app in System Preferences > 
              Security & Privacy > General if macOS blocks it (unsigned build).

              After installation:
                1. Open OpenZigs from Applications
                2. Complete the setup wizard at http://localhost:3001/setup
                3. Authenticate with GitHub Copilot when prompted
            EOS
          end
          FORMULA
          
          # Replace placeholders
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" homebrew-tap/Casks/openzigs.rb
          sed -i "s/ARM64_HASH_PLACEHOLDER/$ARM64_HASH/g" homebrew-tap/Casks/openzigs.rb
          sed -i "s/X64_HASH_PLACEHOLDER/$X64_HASH/g" homebrew-tap/Casks/openzigs.rb

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/openzigs.rb
          git commit -m "Update openzigs to v${{ steps.version.outputs.version }}" || echo "No changes"
          git push

  update-checksums:
    name: Update Release Checksums
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Download all release assets
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          
          mkdir -p assets
          cd assets
          
          # Download all installers
          curl -sLO "https://github.com/openzigs/openzigs/releases/download/v${VERSION}/OpenZigs-Setup-${VERSION}.exe" || true
          curl -sLO "https://github.com/openzigs/openzigs/releases/download/v${VERSION}/OpenZigs-${VERSION}-arm64.dmg" || true
          curl -sLO "https://github.com/openzigs/openzigs/releases/download/v${VERSION}/OpenZigs-${VERSION}-x64.dmg" || true

      - name: Generate checksums file
        run: |
          cd assets
          sha256sum * > checksums.txt || echo "No files to checksum"
          cat checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
