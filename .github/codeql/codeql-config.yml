# CodeQL configuration for openzigs
#
# Scopes path-injection / command-line-injection queries OFF only for
# sidecars/**/*.py because CodeQL cannot statically model the runtime
# sanitizer used in sidecar HTTP handlers:
#
#     candidate = pathlib.Path(user_input).resolve()
#     candidate.relative_to(trusted_root)   # raises ValueError on escape
#
# This containment check IS a correct sanitizer, but it lives outside
# CodeQL's flow-tracking model, producing high-confidence false positives.
#
# All other security queries (SSRF, hardcoded secrets, weak crypto,
# SQL-injection, deserialization, XXE, stack-trace exposure, etc.)
# remain ENABLED on sidecars. Both queries also remain fully enabled
# on src/** and ui/** where the threat model differs (TypeScript code
# is reachable from untrusted external HTTP/WebSocket clients).
#
# See SECURITY.md → "CodeQL configuration" for full rationale.

name: "openzigs CodeQL config"

queries:
  - uses: security-and-quality

query-filters:
  - exclude:
      id: py/path-injection
      paths:
        - sidecars/**
  - exclude:
      id: py/command-line-injection
      paths:
        - sidecars/**

paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/coverage/**"
  - "**/__pycache__/**"
  - "**/test_*.py"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
